<style>
  :root {

    word-break: keep-all; overflow-wrap: anywhere; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation; overscroll-behavior: none;

  button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
  .emo { font-family: var(--emoji); font-weight: 400; line-height: 1; }
  .topbar { flex: none; display: flex; align-items: center; gap: 10px; padding: 6px 14px; min-height: 58px; }
  .brand { flex: 1; display: flex; justify-content: center; align-items: center; gap: 12px; color: #7F9870; font-size: 15px; letter-spacing: .08em; min-width: 0; }
  .mieel-brand { display: flex; align-items: center; gap: 7px; white-space: nowrap; }
  .orb-mini { width: 22px; height: 22px; border-radius: 50%; background: var(--mieel); flex: none; }

  @media (max-width: 699px) { .topbar .url, .topbar .appname { display: none; } }
  .tbtn { height: 48px; min-width: 48px; padding: 0 14px; border-radius: 999px; border: 3px solid var(--line); background: #fff; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 6px; }

  @keyframes ring { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
  main { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 0 16px 14px; }
  .screen { flex: 1; min-height: 0; display: flex; flex-direction: column; animation: fadein .25s ease-out; }

  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes shake { 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }
  @keyframes bump { 40% { transform: scale(1.08); } }
  .big-btn { min-width: min(320px, 78vw); min-height: 86px; padding: 0 30px; border: none; border-radius: 999px; color: #fff; font-size: clamp(24px, 3.2vw, 36px); display: inline-flex; align-items: center; justify-content: center; gap: 10px; }
  .big-btn.go { background: var(--main); box-shadow: 0 8px 0 var(--main-d); }

  .round-btn:active { transform: translateY(3px); box-shadow: none; }

  /* ---------- ホーム ---------- */
  .home { gap: 12px; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 10px; }

  .modes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; flex: none; }
  .mode { display: flex; align-items: center; gap: 12px; border: 4px solid var(--line); background: #fff; border-radius: 24px; padding: 10px 14px; text-align: left; box-shadow: 0 5px 0 rgba(0,0,0,.08); }

  .mode .tx { font-size: clamp(18px, 2.2vw, 25px); line-height: 1.25; }

  .groups { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px 0 6px; flex: none; }

  .groups button.on { border-color: var(--ink); background: #FFF3BF; }
  .themes { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; padding: 2px 2px 10px; }
  .tcard { border: 4px solid var(--line); background: #fff; border-radius: 24px; padding: 14px 10px 12px; display: flex; flex-direction: column; align-items: center; gap: 6px; box-shadow: 0 6px 0 rgba(0,0,0,.08); text-align: center; }

  .tcard .ti { font-size: 48px; line-height: 1.1; min-height: 54px; display: grid; place-items: center; }

  .tcard .tb span { width: 32px; height: 32px; border-radius: 9px; border: 3px solid var(--c, #ADB5BD); display: grid; place-items: center; font-size: 18px; background: #fff; overflow: hidden; }
  .tcard .tb span .shp { width: 22px; height: 22px; }
  .tcard .tb span.t { font-family: inherit; font-weight: 900; font-size: 15px; color: var(--c); }
  .tcard.rand { background: linear-gradient(#FFF9DB, #fff 70%); border-color: #FFE066; }
  .tcard.mine { border-style: dashed; }
  .empty-note { grid-column: 1 / -1; text-align: center; color: var(--sub); font-weight: 500; padding: 30px 10px; line-height: 1.8; }

  /* ---------- あそぶ ---------- */

  .ptop { display: flex; align-items: center; gap: 10px; flex: none; min-height: 60px; }

  .dots { display: flex; gap: 6px; flex: none; }

  .dots i.on { background: var(--main); }
  .dots i.now { background: var(--or); transform: scale(1.25); }
  .quit { position: relative; overflow: hidden; flex: none; border: 2px solid #DEE2E6; background: #fff; color: #868E96; font-size: 15px; padding: 10px 14px; border-radius: 999px; touch-action: none; }
  .quit i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: #FFE3E3; }
  .quit span { position: relative; }
  .quit.pressing { color: #E03131; border-color: #FFA8A8; }
  .quit.pressing i { width: 100%; transition: width 1.5s linear; }
  .table { flex: 1; min-height: 0; display: grid; justify-content: center; align-content: center; gap: 14px; position: relative; --cs: 150px; }
  .card { position: relative; width: var(--cs); height: var(--cs); background: #fff; border-radius: calc(var(--cs) * .16); border: 3px solid #E3E8DE; box-shadow: 0 6px 0 rgba(0,0,0,.1);
    display: flex; flex-direction: column; align-items: center; justify-content: center; touch-action: none; cursor: grab; transform: rotate(var(--rot, 0deg)); animation: pop .35s cubic-bezier(.2, 1.5, .4, 1) backwards; }
  .card .v { font-family: var(--emoji); font-weight: 400; line-height: 1; font-size: calc(var(--cs) * .56); display: grid; place-items: center; pointer-events: none; }
  .card.named .v { font-size: calc(var(--cs) * .46); }
  .card .v .shp { width: calc(var(--cs) * .66); height: calc(var(--cs) * .66); }
  .card.named .v .shp { width: calc(var(--cs) * .56); height: calc(var(--cs) * .56); }
  .card .v img { width: calc(var(--cs) * .8); height: calc(var(--cs) * .62); object-fit: contain; border-radius: 10px; }
  .card .v.k-text { font-family: inherit; font-weight: 900; color: #343A40; font-size: calc(var(--cs) * .52); }
  .card .v.k-size.big { font-size: calc(var(--cs) * .66); }
  .card .v.k-size.small { font-size: calc(var(--cs) * .24); }
  .card .v.k-count { font-size: calc(var(--cs) * .16); }
  .card .nm { font-size: max(12px, calc(var(--cs) * .12)); margin-top: 5%; text-align: center; line-height: 1.15; padding: 0 4px; pointer-events: none; }
  .cnt { display: flex; flex-wrap: wrap; justify-content: center; align-content: center; }

  .cnt.c1 { width: 3.6em; } .cnt.c1 i { font-size: 3.2em; }
  .cnt.c2 { width: 4.7em; } .cnt.c2 i { font-size: 2.1em; }

  .cnt.c5 { width: 5.4em; } .cnt.c5 i { font-size: 1.6em; }
  .card.lifted, .card.gone { visibility: hidden; }
  .card.gone { pointer-events: none; }
  .card.sel { outline: 6px solid var(--blue); outline-offset: 2px; transform: translateY(-6px) rotate(var(--rot, 0deg)); }
  .card.shake { animation: shake .45s; }
  .card.fade { opacity: .25; transition: opacity .5s; pointer-events: none; }
  .float { position: fixed; z-index: 60; margin: 0; pointer-events: none; animation: none; box-shadow: 0 18px 30px rgba(0,0,0,.25); }
  .bins { flex: none; height: clamp(150px, 31vh, 290px); display: flex; gap: 12px; }
  .bins.one { justify-content: center; }
  .bins.one .bin { flex: 0 1 560px; }
  .bin { position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; border: 6px solid var(--c); border-radius: 26px; background: #fff; overflow: hidden; transition: transform .15s, box-shadow .15s; }
  .bin::before { content: ""; position: absolute; inset: 0; background: var(--c); opacity: .09; pointer-events: none; }
  .blabel { position: relative; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 6px 10px; border-bottom: 4px dashed var(--c); font-size: clamp(18px, 2.4vw, 29px); text-align: center; line-height: 1.2; min-height: 58px; }
  .blabel small { display: block; font-size: .55em; color: var(--sub); font-weight: 500; }
  .bic { font-family: var(--emoji); font-weight: 400; font-size: 1.5em; line-height: 1; flex: none; }
  .bic.kana, .bic.num { font-family: inherit; font-weight: 900; color: var(--c); font-size: 1.7em; }
  .blabel .shp { width: 1.7em; height: 1.7em; flex: none; }
  .blabel img { width: 1.9em; height: 1.9em; object-fit: cover; border-radius: 8px; }
  .bin.wordonly .blabel { font-size: clamp(24px, 3.2vw, 38px); }
  .bbody { position: relative; flex: 1; display: flex; flex-wrap: wrap; align-content: flex-start; justify-content: center; gap: 4px; padding: 8px 8px 30px; overflow: hidden; }
  .mini { width: 50px; height: 50px; display: grid; place-items: center; font-family: var(--emoji); font-weight: 400; font-size: 36px; line-height: 1; background: #fff; border-radius: 10px; box-shadow: 0 2px 0 rgba(0,0,0,.1); animation: pop .3s cubic-bezier(.2, 1.6, .4, 1); overflow: hidden; }
  .mini .shp, .mini img { width: 40px; height: 40px; object-fit: contain; }
  .mini.k-count { font-size: 8px; } .mini.k-size.small { font-size: 16px; } .mini.k-size.big { font-size: 40px; }
  .mini.k-text { font-family: inherit; font-weight: 900; font-size: 26px; color: #343A40; }
  .bcount { position: absolute; right: 10px; bottom: 7px; background: var(--c); color: #fff; border-radius: 999px; padding: 1px 11px; font-size: 17px; }
  .bin.over { transform: scale(1.04); box-shadow: 0 0 0 9px rgba(47,158,68,.28); }

  .bin.ng { animation: shake .45s; }
  .bin.ok { animation: bump .45s; }
  .bins.choosing .bin { box-shadow: 0 0 0 6px rgba(28,126,214,.35); }
  .popw { position: fixed; z-index: 65; transform: translate(-50%, -50%); font-size: 32px; font-weight: 900; -webkit-text-stroke: 5px #fff; paint-order: stroke fill; pointer-events: none; white-space: nowrap; animation: popw 1.1s ease-out forwards; }
  @keyframes popw { 0% { transform: translate(-50%, -20%) scale(.4); opacity: 0; } 25% { transform: translate(-50%, -80%) scale(1.15); opacity: 1; } 75% { opacity: 1; } 100% { transform: translate(-50%, -140%) scale(1); opacity: 0; } }
  .praise { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%); font-size: clamp(54px, 9vw, 110px); font-weight: 900; white-space: nowrap; -webkit-text-stroke: 6px #fff; paint-order: stroke fill; pointer-events: none; z-index: 62; animation: praise 1.4s ease-out forwards; }
  @keyframes praise { 0% { transform: translate(-50%, -50%) scale(.3); opacity: 0; } 20% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; } 75% { transform: translate(-50%, -54%) scale(1); opacity: 1; } 100% { transform: translate(-50%, -70%) scale(1); opacity: 0; } }
  .single .card { animation: pop .4s cubic-bezier(.2, 1.5, .4, 1) backwards; }
  .left-n { position: absolute; right: 6px; bottom: 4px; color: var(--sub); font-size: 16px; font-weight: 500; }

  /* ---------- けっか ---------- */
  .result { align-items: center; justify-content: center; gap: 14px; text-align: center; overflow-y: auto; }

  .rainbow-text { background: linear-gradient(90deg, #FF6B6B, #FFA94D, #FFD43B, #69DB7C, #4DABF7, #9775FA, #F783AC); -webkit-background-clip: text; background-clip: text; color: transparent; background-size: 200% 100%; animation: rb 2s linear infinite; filter: drop-shadow(0 4px 0 #fff) drop-shadow(0 6px 0 rgba(0,0,0,.12)); }
  @keyframes rb { to { background-position: 200% 0; } }
  .stars { font-size: clamp(54px, 8vw, 90px); letter-spacing: 6px; }

  .rstat { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  .rstat div { background: #fff; border: 4px solid var(--line); border-radius: 20px; padding: 8px 22px; font-size: 22px; }
  .rstat small { display: block; font-size: 13px; color: var(--sub); font-weight: 500; }

  @keyframes dance { from { transform: translateY(0) rotate(-8deg); } to { transform: translateY(-18px) rotate(8deg); } }

  .toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); background: rgba(17,24,39,.9); color: #fff; padding: 14px 22px; border-radius: 14px; font-size: 18px; z-index: 95; display: none; max-width: 90vw; text-align: center; }
  .toast.show { display: block; }
  body.calm *, body.calm *::before, body.calm *::after { animation: none !important; transition: none !important; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  @media (orientation: portrait) {
    .bins { height: clamp(150px, 25vh, 300px); }
    .modes { grid-template-columns: 1fr; }
    .mode { padding: 8px 14px; }
    .mode .emo { font-size: 34px; }
  }
  @media (max-width: 640px) {
    .modes { grid-template-columns: 1fr; gap: 8px; }
    .themes { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }

    .tcard .tn { font-size: 15px; }
    .bins { gap: 6px; }
    .bin { border-width: 4px; border-radius: 18px; }
    .blabel { font-size: 16px; min-height: 46px; gap: 4px; flex-direction: column; }
    .quit span { font-size: 12px; }
  }

  /* ---------- 先生用・プリント ---------- */
  .modal { position: fixed; inset: 0; z-index: 90; background: rgba(17,24,39,.55); display: none; align-items: flex-start; justify-content: center; padding: 24px 12px; overflow-y: auto; -webkit-user-select: text; user-select: text; }
  .modal.open { display: flex; }
  .panel { width: min(100%, 860px); background: #fff; border-radius: 24px; padding: 22px clamp(16px, 4vw, 32px) 28px; font-weight: 400; font-size: 17px; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
  .panel.wide { width: min(100%, 1180px); }
  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .panel h2 { margin: 0; font-size: 25px; font-weight: 700; }
  .panel h3 { margin: 26px 0 10px; font-size: 20px; font-weight: 700; padding-left: 10px; border-left: 6px solid var(--main); }
  .note { color: var(--sub); font-size: 15px; line-height: 1.6; margin: 6px 0; }
  .seglabel { margin: 12px 0 6px; font-weight: 700; font-size: 15px; }
  .seg { display: flex; gap: 8px; flex-wrap: wrap; }
  .seg button { flex: 1; min-width: 90px; padding: 11px 8px; font-size: 15px; font-weight: 700; border-radius: 12px; border: 2px solid #CED4DA; background: #fff; }
  .seg button.on { background: var(--ink); border-color: var(--ink); color: #fff; }
  .panel label.row { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 6px 0; border-bottom: 1px solid #F1F3F5; }
  .panel label.row > span:first-child { flex: 1; }
  .panel input[type=checkbox] { width: 30px; height: 30px; accent-color: var(--main); flex: none; }
  .panel input[type=range] { width: 200px; }
  .panel input[type=text], .panel select { font: inherit; padding: 9px 12px; border: 2px solid #CED4DA; border-radius: 12px; background: #fff; }
  .btns { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
  .btn { display: inline-flex; align-items: center; gap: 6px; border: none; border-radius: 12px; padding: 11px 18px; font-size: 16px; font-weight: 700; background: #E9ECEF; color: var(--ink); }
  .btn.ok { background: var(--main); color: #fff; }
  .btn.blue { background: var(--blue); color: #fff; }
  .btn.warn { background: #FFF0F0; color: #C92A2A; }
  .crow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 6px 0; }
  .ctheme { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 2px solid #E9ECEF; border-radius: 14px; margin: 6px 0; }
  .ctheme small { color: var(--sub); }
  .editor { background: #F8F9FA; border-radius: 16px; padding: 12px; margin: 4px 0 14px; }
  .ebin { background: #fff; border: 4px solid var(--c); border-radius: 16px; padding: 10px 12px; margin: 10px 0; }
  .colors { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0; }
  .cchip { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 2px #CED4DA; }
  .cchip.on { box-shadow: 0 0 0 4px var(--ink); }
  .eitems { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .eitem { display: inline-flex; align-items: center; gap: 6px; border: 2px solid #E9ECEF; border-radius: 12px; padding: 4px 6px 4px 4px; font-size: 15px; background: #fff; }
  .eitem .ev { width: 38px; height: 38px; display: grid; place-items: center; font-family: var(--emoji); font-size: 28px; overflow: hidden; border-radius: 8px; }
  .eitem .ev img, .eitem .ev .shp { width: 38px; height: 38px; object-fit: cover; }
  .eitem .ev.k-text { font-family: inherit; font-weight: 900; font-size: 22px; }
  .eitem button { border: none; background: #FFF0F0; color: #C92A2A; border-radius: 8px; width: 28px; height: 28px; }

  /* ============================================================

  const PR_TYPES = [

  function pPage(title, inst, body, isAns) {

      '<div class="pinst">' + inst + '</div><div class="pbody">' + body + '</div><div class="pfoot">MieeL なかまわけ ／ mieel-support-school.com</div></div>';
  }

  const prCardOpts = type => type === 'line' ? [[4, '4'], [6, '6'], [8, '8']] : type === 'cut' ? [[6, '6'], [8, '8'], [12, '12'], [16, '16']] : [[8, '8'], [12, '12'], [16, '16']];

      h('div', { class: 'btns' }, h('button', { type: 'button', class: 'btn', onclick: exportCsv }, '⬇ CSV で かきだす'),
        h('button', { type: 'button', class: 'btn warn', onclick: () => { if (confirm('きろくを ぜんぶ けしますか？')) { log.length = 0; persist(); refresh(); } } }, 'きろくを けす')),
      h('h3', null, 'バックアップ（べつの iPad へ うつす）'),
      h('div', { class: 'btns' }, h('button', { type: 'button', class: 'btn', onclick: exportJson }, '⬇ ファイルに ほぞん'),
        h('label', { class: 'btn' }, '⬆ ファイルから よみこむ', h('input', { type: 'file', accept: 'application/json,.json', hidden: true, onchange: importJson }))),
      h('div', { class: 'btns', style: 'margin-top:24px' }, h('button', { type: 'button', class: 'btn ok', onclick: closeSettings }, 'とじる')),
      h('div', { class: 'mieel-foot' }, h('div', { class: 'mieel-brand' }, h('span', { class: 'orb-mini' }), h('strong', null, 'MieeL'), h('a', { href: 'https://www.mieel-support-school.com/', target: '_blank', rel: 'noopener' }, 'www.mieel-support-school.com')), '© なかまわけ（特別支援教育向け）')
    );
  }
  function download(name, text, type) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: type })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800); }
  function exportCsv() {
    const rows = [['日にち', '時刻', 'テーマ', 'モード', 'できたまい数', 'まちがい', 'かかった秒', 'とちゅうまで']].concat(log.map(l => [l.d, l.at || '', l.theme, l.mode || '', l.n, l.miss, l.sec, l.stop ? '○' : '']));
    download('nakamawake.csv', '﻿' + rows.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\r\n'), 'text/csv');
  }
  function exportJson() { download('nakamawake-backup.json', JSON.stringify({ app: 'nakamawake', v: 1, settings: st, custom: custom, log: log }), 'application/json'); }
  function importJson(e) {
    const f = e.target.files && e.target.files[0]; e.target.value = ''; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const o = JSON.parse(String(r.result)); if (!o || o.app !== 'nakamawake') throw new Error();
        if (!confirm('よみこむと、いまの せってい・じぶんで つくった テーマ・きろくが おきかわります。よろしいですか？')) return;
        Object.assign(st, DEF, o.settings || {}); custom.length = 0; (o.custom || []).forEach(x => custom.push(x)); log.length = 0; (o.log || []).forEach(x => log.push(x));
        persist(); refresh(); toast('よみこみました');
      } catch (err) { toast('この ファイルは よみこめません'); }
    };
    r.readAsText(f);
  }
  function bindGear() {
    const g = $('#gear'); let t = null; const c = () => { clearTimeout(t); g.classList.remove('pressing'); };
    g.addEventListener('pointerdown', e => { e.preventDefault(); g.classList.add('pressing'); t = setTimeout(() => { c(); openSettings(); }, 1500); });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => g.addEventListener(ev, c));
    g.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', e => { if (e.shiftKey && (e.key === 'S' || e.key === 's') && !/INPUT|SELECT|TEXTAREA/.test((e.target || {}).tagName || '')) openSettings(); if (e.key === 'Escape') { closeSettings(); closePrint(); } });
    $('#settings').addEventListener('click', e => { if (e.target.id === 'settings') closeSettings(); });
    $('#printModal').addEventListener('click', e => { if (e.target.id === 'printModal') closePrint(); });
  }
  function makeTouchIcon() { try { const c = document.createElement('canvas'); c.width = c.height = 180; const g = c.getContext('2d'); g.fillStyle = '#8CE99A'; g.fillRect(0, 0, 180, 180); g.font = '118px "Apple Color Emoji","Segoe UI Emoji",sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('🧺', 90, 98); $('#touchIcon').href = c.toDataURL(); } catch (e) { /* 無視 */ } }

  document.body.classList.toggle('calm', !!st.calm);
  bindGear(); makeTouchIcon();
  if (canSpeak) { loadVoice(); speechSynthesis.onvoiceschanged = loadVoice; }
  document.addEventListener('gesturestart', e => e.preventDefault());
  $('#homeBtn').addEventListener('click', () => { if (tapOk(500)) renderHome(); });
  $('#printBtn').addEventListener('click', () => { if (tapOk(500)) { if (G) pr.theme = G.theme.id; openPrint(); } });
  window.__nk = { get G() { return G; }, st: st, themes: allThemes, pr: pr };   // テスト用
  renderHome();
})();
</script>
</body>
</html>
